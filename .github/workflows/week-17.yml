name: Week 17 CI/CD

on:
  push:
    branches: [ master, main ]
    paths:
      - 'weeks/week-17/**'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'weeks/week-17/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run tests
      run: |
        STUDENT_ID=s13 GROUP=433 python3 -m pytest week-17/tests/test_week_17.py
